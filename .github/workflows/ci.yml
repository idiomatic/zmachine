name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-linux
            os: ubuntu-24.04-arm
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-windows
            os: windows-latest
          - target: aarch64-windows
            os: windows-11-arm
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the version named by minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@v2
      # Once is enough, and Windows checkouts have CRLF line endings.
      - name: Check formatting
        if: matrix.target == 'x86_64-linux'
        run: zig fmt --check build.zig src tools
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
      # The walkthroughs stay local, so here this only checks that the step
      # builds and skips them.
      - name: Walkthroughs
        run: zig build walkthrough

  # Cross-compiles stripped release archives for every target once the
  # builds pass. A pushed tag such as v0.1.0 also publishes them as a
  # GitHub release.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
      - name: Build release archives
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",/\1/p' build.zig.zon)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in build.zig.zon"
            exit 1
          fi
          mkdir dist
          for target in x86_64-linux aarch64-linux x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            name=zmachine-$version-$target
            zig build -Doptimize=ReleaseSafe -Dstrip=true -Dtarget=$target -p "stage/$name"
            cp README.md LICENSE "stage/$name/"
            mv "stage/$name/bin/"* "stage/$name/"
            rmdir "stage/$name/bin"
            if [[ $target == *windows ]]; then
              (cd stage && zip -qr "../dist/$name.zip" "$name")
            else
              tar -czf "dist/$name.tar.gz" -C stage "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: zmachine-release
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
