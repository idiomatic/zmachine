<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-Machine Inspector</title>
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --panel-2: #f0eee8;
  --border: #dedbd2;
  --text: #22211e;
  --muted: #76726a;
  --accent: #c2410c;
  --accent-soft: #fde7d9;
  --link: #1d4ed8;
  --room: #ffffff;
  --room-border: #9b968b;
  --edge: #a8a397;
  --flash: #fef08a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15161a;
    --panel: #1d1f24;
    --panel-2: #24272d;
    --border: #33363e;
    --text: #e6e4df;
    --muted: #9a978f;
    --accent: #fb923c;
    --accent-soft: #3d2516;
    --link: #93b4ff;
    --room: #23262c;
    --room-border: #5d606a;
    --edge: #5a5d66;
    --flash: #5b4b0f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-wrap: wrap;
}
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.meta b { color: var(--text); font-weight: 600; }
.status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
.dot.live { background: #16a34a; box-shadow: 0 0 0 3px #16a34a33; }
.dot.down { background: #dc2626; }
main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) 5px minmax(0, 1fr);
  min-height: 0;
}
section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
/* The boundary between the panels, dragged to resize them. */
.splitter { cursor: col-resize; background: var(--border); background-clip: content-box; padding: 0 2px; touch-action: none; }
.splitter:hover, .splitter.dragging { background: var(--accent); padding: 0 1px; }
.tab[draggable="true"] { cursor: grab; }
.tab.dragging { opacity: .45; }
.tabs.drop-target { background: var(--accent-soft); }
.tab.drop-before { box-shadow: inset 2px 0 0 var(--accent); }
.tabs.drop-end::after { content: ""; width: 2px; align-self: stretch; margin: 4px 0; background: var(--accent); }
#default-layout {
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 6px; cursor: pointer;
}
.tabs { display: flex; gap: 2px; padding: 8px 12px 0; background: var(--panel); border-bottom: 1px solid var(--border); }
.tab {
  border: 0; background: none; color: var(--muted); font: inherit; font-weight: 550;
  padding: 7px 12px; border-bottom: 2px solid transparent; cursor: pointer;
}
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.pane { flex: 1; min-height: 0; display: none; }
.pane.active { display: flex; }
#map-pane { position: relative; overflow: hidden; }
#map { width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
.map-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.map-tools button, .toolbar button {
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; cursor: pointer;
}
.map-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.room rect { fill: var(--room); stroke: var(--room-border); stroke-width: 1.2; rx: 8; }
.room text { fill: var(--text); font: 12px var(--sans); text-anchor: middle; dominant-baseline: middle; }
.room.here rect { stroke: var(--accent); stroke-width: 2.5; fill: var(--accent-soft); }
.room { cursor: pointer; }
.room.moving { cursor: grabbing; opacity: .85; }
.edge { stroke: var(--edge); stroke-width: 1.6; fill: none; }
.edge.vertical { stroke-dasharray: 5 4; }
.edge.unknown { stroke-dasharray: 2 4; }
.edge-label {
  fill: var(--muted); font: 600 10px var(--mono); text-anchor: middle; dominant-baseline: middle;
  paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round;
}
.arrowhead { fill: var(--edge); }
.edge-label.fixable { cursor: pointer; }
.edge-label.fixable:hover { fill: var(--accent); }
#objects-pane { flex-direction: column; }
.toolbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.toolbar input {
  flex: 1; min-width: 0; font: inherit; padding: 5px 9px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
}
.split { flex: 1; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
#tree { overflow: auto; padding: 6px 0; font: 13px/1.6 var(--mono); border-bottom: 1px solid var(--border); }
#tree ul { list-style: none; margin: 0; padding-left: 16px; }
#tree > ul { padding-left: 6px; }
.node { display: flex; align-items: baseline; gap: 6px; padding: 0 8px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
.node:hover { background: var(--panel-2); }
.node.selected { background: var(--accent-soft); }
.node .tw { width: 12px; color: var(--muted); flex: none; text-align: center; }
.node .id { color: var(--muted); }
.node.here .nm { color: var(--accent); font-weight: 700; }
.node.flash { animation: flash 2.4s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
#detail { overflow: auto; padding: 14px 16px; }
#detail h2 { margin: 0 0 4px; font-size: 16px; }
#detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
#detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.links { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; }
.links span:nth-child(odd) { color: var(--muted); }
a.obj { color: var(--link); text-decoration: none; cursor: pointer; }
a.obj:hover { text-decoration: underline; }
.attrs { display: flex; flex-wrap: wrap; gap: 3px; }
.attr {
  font: 11px var(--mono); width: 26px; text-align: center; padding: 2px 0; border-radius: 4px;
  background: var(--panel-2); color: var(--muted);
}
.attr.on { background: var(--accent); color: #fff; font-weight: 700; }
table { border-collapse: collapse; width: 100%; font: 12px var(--mono); }
th, td { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
td.hex { word-break: break-all; }
.placeholder { color: var(--muted); padding: 20px 4px; }
/* Fill the pane, so the scrollbar sits at its edge. */
#globals, #history { flex: 1; min-width: 0; }
#globals { overflow: auto; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 4px; align-content: start; font: 12px var(--mono); }
.g { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; display: flex; justify-content: space-between; gap: 6px; }
.g .k { color: var(--muted); }
.g.flash { animation: flash 2.4s ease-out; }
#history { overflow: auto; padding: 12px 16px 12px 3.5em; font: 13px/1.7 var(--mono); margin: 0; }
#history li { color: var(--text); }
#history li::marker { color: var(--muted); }
/* Space-constrained screens keep a fixed, stacked layout. */
@media (max-width: 860px) {
  main { grid-template-columns: 1fr !important; grid-template-rows: minmax(320px, 1fr) minmax(420px, 1fr); }
  section + .splitter + section { border-top: 1px solid var(--border); }
  .splitter, #default-layout { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Z-Machine Inspector</h1>
  <div class="meta">
    <span>Story <b id="story">-</b></span>
    <span>Seed <b id="seed">-</b></span>
    <span>Turn <b id="turn">0</b></span>
    <span>Location <b id="location">-</b></span>
  </div>
  <div class="status">
    <button id="default-layout" title="Put the tabs and panels back where they started">Default layout</button>
    <span class="dot" id="dot"></span><span id="conn">connecting</span>
  </div>
</header>
<main>
  <section>
    <div class="tabs">
      <button class="tab active" data-pane="map-pane">Map</button>
      <button class="tab" data-pane="globals-pane">Globals</button>
      <button class="tab" data-pane="history-pane">History</button>
    </div>
    <div class="pane active" id="map-pane">
      <svg id="map"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker><filter id="shadow-blur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="10"/></filter></defs><g id="viewport"><g id="edges"></g><g id="rooms"></g></g></svg>
      <div class="map-tools">
        <button id="zoom-in" title="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out">&minus;</button>
        <button id="recenter" title="Fit the map, or center on the current room, and follow the player again">Fit</button>
        <button id="erase-map" title="Erase the map and start it again from the current room">Reset</button>
      </div>
      <div class="map-empty" id="map-empty">The map fills in as you explore.</div>
    </div>
    <div class="pane" id="globals-pane"><div id="globals"></div></div>
    <div class="pane" id="history-pane"><ol id="history"></ol></div>
  </section>
  <div class="splitter" id="splitter" title="Drag to resize the panels"></div>
  <section>
    <div class="tabs"><button class="tab active" data-pane="objects-pane">Objects</button></div>
    <div class="pane active" id="objects-pane">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Filter by name or number" autocomplete="off">
        <button id="follow" title="Select the current room">Here</button>
      </div>
      <div class="split">
        <div id="tree"></div>
        <div id="detail"><div class="placeholder">Select an object to see its attributes and properties.</div></div>
      </div>
    </div>
  </section>
</main>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";

let state = null;
let byId = new Map();
let selected = 0;
let expanded = new Set();
let lastGlobals = null;
let flashObjects = new Set();

// Tabs and panels

const LAYOUT_KEY = "zmachine-inspector-layout";
const panels = [...document.querySelectorAll("main > section")];
const DEFAULT_LAYOUT = {
  panels: panels.map((p) => [...p.querySelectorAll(".tab")].map((t) => t.dataset.pane)),
  active: panels.map((p) => p.querySelector(".tab.active").dataset.pane),
  split: 1.35 / 2.35,
};
let layoutState = DEFAULT_LAYOUT;
// Tiling is off on space-constrained screens, which keep the stacked layout.
const tiling = window.matchMedia("(min-width: 861px)");

function activate(tab) {
  const section = tab.closest("section");
  for (const t of section.querySelectorAll(".tab")) t.classList.toggle("active", t === tab);
  for (const p of section.querySelectorAll(".pane")) p.classList.toggle("active", p.id === tab.dataset.pane);
  if (tab.dataset.pane === "map-pane") applyView();
}

function tabFor(pane) {
  return document.querySelector(`.tab[data-pane="${pane}"]`);
}

// Puts each tab and its pane in its panel, in order, and sizes the panels.
function applyLayout(layout) {
  layout.panels.forEach((ids, i) => {
    const bar = panels[i].querySelector(".tabs");
    for (const id of ids) {
      bar.append(tabFor(id));
      panels[i].append($(id));
    }
    activate(tabFor(layout.active[i]));
  });
  const r = layout.split;
  document.querySelector("main").style.gridTemplateColumns = `minmax(0, ${r}fr) 5px minmax(0, ${1 - r}fr)`;
  layoutState = layout;
}

function currentLayout() {
  return {
    panels: panels.map((p) => [...p.querySelectorAll(".tab")].map((t) => t.dataset.pane)),
    active: panels.map((p) => p.querySelector(".tab.active").dataset.pane),
    split: layoutState.split,
  };
}

function saveLayout() {
  layoutState = currentLayout();
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layoutState)); } catch {}
}

// A saved layout is used only if it still names every tab once, with none
// of the panels empty.
function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
    const ids = DEFAULT_LAYOUT.panels.flat().sort().join();
    if (!saved || saved.panels.length !== panels.length) return DEFAULT_LAYOUT;
    if (saved.panels.flat().sort().join() !== ids || saved.panels.some((p) => !p.length)) return DEFAULT_LAYOUT;
    if (!saved.active.every((a, i) => saved.panels[i].includes(a))) return DEFAULT_LAYOUT;
    if (!(saved.split >= 0.15 && saved.split <= 0.85)) return DEFAULT_LAYOUT;
    return saved;
  } catch {
    return DEFAULT_LAYOUT;
  }
}

for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    activate(tab);
    if (tiling.matches) saveLayout();
  });
}

// Dragging a tab onto a tab bar moves it there, before the tab it is
// dropped on, and brings it to the front. A panel keeps at least one tab.
(() => {
  let dragged = null;
  const clearMarks = () => {
    for (const el of document.querySelectorAll(".drop-target, .drop-before, .drop-end")) {
      el.classList.remove("drop-target", "drop-before", "drop-end");
    }
  };
  const setDraggable = () => {
    for (const tab of document.querySelectorAll(".tab")) tab.draggable = tiling.matches;
  };
  setDraggable();
  tiling.addEventListener("change", () => {
    setDraggable();
    applyLayout(tiling.matches ? loadLayout() : DEFAULT_LAYOUT);
  });
  // Where a drop at clientX would land: before a tab, or at the end.
  const dropPoint = (bar, x) => {
    for (const t of bar.querySelectorAll(".tab")) {
      if (t === dragged) continue;
      const r = t.getBoundingClientRect();
      if (x < r.left + r.width / 2) return t;
    }
    return null;
  };
  const allowed = (bar) => {
    const from = dragged.closest("section");
    return bar.closest("section") === from || from.querySelectorAll(".tab").length > 1;
  };
  for (const tab of document.querySelectorAll(".tab")) {
    tab.addEventListener("dragstart", (ev) => {
      dragged = tab;
      tab.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", tab.dataset.pane);
    });
    tab.addEventListener("dragend", () => {
      tab.classList.remove("dragging");
      dragged = null;
      clearMarks();
    });
  }
  for (const bar of document.querySelectorAll(".tabs")) {
    bar.addEventListener("dragover", (ev) => {
      if (!dragged || !allowed(bar)) return;
      ev.preventDefault();
      ev.dataTransfer.dropEffect = "move";
      clearMarks();
      bar.classList.add("drop-target");
      const before = dropPoint(bar, ev.clientX);
      if (before) before.classList.add("drop-before");
      else bar.classList.add("drop-end");
    });
    bar.addEventListener("dragleave", (ev) => {
      if (!bar.contains(ev.relatedTarget)) clearMarks();
    });
    bar.addEventListener("drop", (ev) => {
      if (!dragged || !allowed(bar)) return;
      ev.preventDefault();
      const from = dragged.closest("section");
      const to = bar.closest("section");
      const before = dropPoint(bar, ev.clientX);
      bar.insertBefore(dragged, before);
      to.append($(dragged.dataset.pane));
      if (from !== to) {
        const rest = from.querySelector(".tab.active") || from.querySelector(".tab");
        activate(rest);
      }
      activate(dragged);
      clearMarks();
      saveLayout();
    });
  }
})();

// Dragging the boundary between the panels resizes them.
(() => {
  const splitter = $("splitter");
  const main = document.querySelector("main");
  let dragging = false;
  splitter.addEventListener("pointerdown", (ev) => {
    dragging = true;
    splitter.setPointerCapture(ev.pointerId);
    splitter.classList.add("dragging");
  });
  splitter.addEventListener("pointermove", (ev) => {
    if (!dragging) return;
    const r = main.getBoundingClientRect();
    const split = Math.min(0.85, Math.max(0.15, (ev.clientX - r.left) / r.width));
    main.style.gridTemplateColumns = `minmax(0, ${split}fr) 5px minmax(0, ${1 - split}fr)`;
    layoutState = { ...layoutState, split };
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("dragging");
    saveLayout();
  };
  splitter.addEventListener("pointerup", end);
  splitter.addEventListener("pointercancel", end);
})();

$("default-layout").addEventListener("click", () => {
  applyLayout(DEFAULT_LAYOUT);
  try { localStorage.removeItem(LAYOUT_KEY); } catch {}
});

// Polling

async function poll() {
  let generation = 0;
  for (;;) {
    try {
      const res = await fetch(`/state?since=${generation}`, { cache: "no-store" });
      setConnection(true);
      if (res.status === 200) {
        const data = await res.json();
        generation = data.generation;
        update(data);
      }
    } catch (err) {
      setConnection(false);
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}

function setConnection(up) {
  $("dot").className = "dot " + (up ? "live" : "down");
  $("conn").textContent = up ? "live" : "disconnected";
}

function update(data) {
  const first = state === null;
  erasing = Boolean(data.erasing);
  state = data;
  byId = new Map(data.objects.map((o) => [o.id, o]));
  flashObjects = new Set(data.changed);

  $("story").textContent = `v${data.version} r${data.release} ${data.serial}`;
  $("seed").textContent = data.seed_random ? `${data.seed} (random)` : data.seed;
  $("turn").textContent = data.turn;
  const here = byId.get(data.location);
  $("location").textContent = here ? `${here.name || "(unnamed)"} (#${here.id})` : "-";

  if (first && data.location) {
    selected = data.location;
    revealObject(data.location);
  }
  renderTree();
  renderDetail();
  renderGlobals();
  renderHistory();
  renderMap();
}

// Object tree

function displayName(o) {
  return o.name || "(unnamed)";
}

function childrenOf(o) {
  const out = [];
  let c = o.child;
  const seen = new Set();
  while (c && byId.has(c) && !seen.has(c)) {
    seen.add(c);
    out.push(byId.get(c));
    c = byId.get(c).sibling;
  }
  return out;
}

function revealObject(id) {
  let o = byId.get(id);
  const seen = new Set();
  while (o && o.parent && !seen.has(o.parent)) {
    seen.add(o.parent);
    expanded.add(o.parent);
    o = byId.get(o.parent);
  }
  expanded.add(id);
}

function matches(o, q) {
  return String(o.id) === q || displayName(o).toLowerCase().includes(q);
}

function renderTree() {
  const q = $("search").value.trim().toLowerCase();
  const roots = state.objects.filter((o) => !o.parent || !byId.has(o.parent));
  // When filtering, keep matches and their ancestors.
  let keep = null;
  if (q) {
    keep = new Set();
    for (const o of state.objects) {
      if (!matches(o, q)) continue;
      let p = o;
      const seen = new Set();
      while (p && !seen.has(p.id)) {
        seen.add(p.id);
        keep.add(p.id);
        p = byId.get(p.parent);
      }
    }
  }
  const tree = $("tree");
  const scroll = tree.scrollTop;
  tree.replaceChildren(buildList(roots, keep, q, 0));
  tree.scrollTop = scroll;
}

function buildList(objects, keep, q, depth) {
  const ul = document.createElement("ul");
  for (const o of objects) {
    if (keep && !keep.has(o.id)) continue;
    const kids = childrenOf(o);
    const open = q ? true : expanded.has(o.id);
    const li = document.createElement("li");
    const row = document.createElement("div");
    row.className = "node";
    if (o.id === selected) row.classList.add("selected");
    if (o.id === state.location) row.classList.add("here");
    if (flashObjects.has(o.id)) row.classList.add("flash");
    const twisty = document.createElement("span");
    twisty.className = "tw";
    twisty.textContent = kids.length ? (open ? "▾" : "▸") : "";
    const id = document.createElement("span");
    id.className = "id";
    id.textContent = `#${o.id}`;
    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = displayName(o);
    row.append(twisty, id, nm);
    row.addEventListener("click", (ev) => {
      if (ev.target === twisty && kids.length) {
        if (expanded.has(o.id)) expanded.delete(o.id); else expanded.add(o.id);
      } else {
        select(o.id, false);
        return;
      }
      renderTree();
    });
    li.append(row);
    if (kids.length && open && depth < 64) li.append(buildList(kids, keep, q, depth + 1));
    ul.append(li);
  }
  return ul;
}

function select(id, reveal) {
  if (!byId.has(id)) return;
  selected = id;
  if (reveal) revealObject(id);
  expanded.add(id);
  renderTree();
  renderDetail();
  renderMap();
}

// Object detail

function objLink(id) {
  if (!id) return document.createTextNode("none");
  const a = document.createElement("a");
  a.className = "obj";
  const o = byId.get(id);
  a.textContent = o ? `#${id} ${displayName(o)}` : `#${id}`;
  a.addEventListener("click", () => select(id, true));
  return a;
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function renderDetail() {
  const box = $("detail");
  const o = byId.get(selected);
  if (!o) return;
  const frag = document.createDocumentFragment();
  frag.append(el("h2", displayName(o)));
  frag.append(el("div", `Object #${o.id}` + (o.id === state.location ? " · current location" : ""), "sub"));

  const links = el("div", undefined, "links");
  for (const [label, id] of [["Parent", o.parent], ["Sibling", o.sibling], ["Child", o.child]]) {
    const v = el("span");
    v.append(objLink(id));
    links.append(el("span", label), v);
  }
  frag.append(links);

  const kids = childrenOf(o);
  if (kids.length) {
    frag.append(el("h3", `Contents (${kids.length})`));
    const list = el("div", undefined, "links");
    list.style.gridTemplateColumns = "1fr";
    for (const k of kids) {
      const s = el("span");
      s.append(objLink(k.id));
      list.append(s);
    }
    frag.append(list);
  }

  frag.append(el("h3", "Attributes"));
  const attrs = el("div", undefined, "attrs");
  const count = state.version <= 3 ? 32 : 48;
  const on = new Set(o.attrs);
  for (let i = 0; i < count; i++) {
    const a = el("span", String(i), "attr" + (on.has(i) ? " on" : ""));
    a.title = `attribute ${i}` + (on.has(i) ? " (set)" : "");
    attrs.append(a);
  }
  frag.append(attrs);

  frag.append(el("h3", `Properties (${o.props.length})`));
  if (o.props.length) {
    const table = el("table");
    const head = el("tr");
    head.append(el("th", "#"), el("th", "len"), el("th", "bytes"), el("th", "value"));
    table.append(head);
    for (const p of o.props) {
      const tr = el("tr");
      const len = p.d.length / 2;
      let value = "";
      if (len === 1) value = String(parseInt(p.d, 16));
      else if (len === 2) value = String(parseInt(p.d, 16));
      const hex = el("td", p.d.match(/../g)?.join(" ") ?? "", "hex");
      const vcell = el("td", value);
      if (len === 2) {
        const n = parseInt(p.d, 16);
        if (byId.has(n) && n > 0) {
          vcell.textContent = "";
          vcell.append(document.createTextNode(`${n} `), objLink(n));
        }
      }
      tr.append(el("td", String(p.n)), el("td", String(len)), hex, vcell);
      table.append(tr);
    }
    frag.append(table);
  } else {
    frag.append(el("div", "No properties.", "placeholder"));
  }
  const scroll = box.scrollTop;
  box.replaceChildren(frag);
  box.scrollTop = scroll;
}

// Globals and history

function renderGlobals() {
  const box = $("globals");
  const frag = document.createDocumentFragment();
  state.globals.forEach((v, i) => {
    const g = el("div", undefined, "g");
    if (lastGlobals && lastGlobals[i] !== v) g.classList.add("flash");
    g.append(el("span", `G${i.toString(16).padStart(2, "0")}`, "k"), el("span", String(v)));
    g.title = `global ${i} (variable ${i + 16}) = ${v} / 0x${v.toString(16)}`;
    frag.append(g);
  });
  box.replaceChildren(frag);
  lastGlobals = state.globals;
}

function renderHistory() {
  const list = $("history");
  list.replaceChildren(...state.commands.map((c) => el("li", c)));
  list.scrollTop = list.scrollHeight;
}

// Map

const DIRS = {
  n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0],
  ne: [1, -1], nw: [-1, -1], se: [1, 1], sw: [-1, 1],
};
const INVERSE = { n: "s", s: "n", e: "w", w: "e", ne: "sw", sw: "ne", nw: "se", se: "nw", up: "down", down: "up", in: "out", out: "in", unknown: "unknown" };
// Preferred spots for moves with no compass direction.
const FALLBACK = { up: [1, -1], down: [-1, 1], in: [1, 1], out: [-1, -1], unknown: [1, 1] };
const CELL_W = 170, CELL_H = 96, ROOM_W = 132, ROOM_H = 48;

const view = { x: 0, y: 0, scale: 1, userMoved: false };
let positions = new Map();
let lastLocation = 0;
// The map was erased; until the server's next snapshot, show only the
// current room.
let erasing = false;

// Rooms the viewer has dragged, by story: room number to grid cell. They
// are placed first, and the automatic layout fills in around them.
let pins = new Map();
let pinsKey = null;

function loadPins() {
  const key = `zmachine-inspector-pins:r${state.release}-${state.serial}`;
  if (key === pinsKey) return;
  pinsKey = key;
  pins = new Map();
  try {
    for (const [id, cell] of Object.entries(JSON.parse(localStorage.getItem(key)) || {})) pins.set(Number(id), cell);
  } catch {}
}

function savePins() {
  try {
    if (pins.size) localStorage.setItem(pinsKey, JSON.stringify(Object.fromEntries(pins)));
    else localStorage.removeItem(pinsKey);
  } catch {}
}

function layout(rooms, edges) {
  const pos = new Map();
  const taken = new Set();
  const key = (x, y) => `${x},${y}`;
  const place = (id, x, y) => { pos.set(id, [x, y]); taken.add(key(x, y)); };
  const near = (x, y) => {
    if (!taken.has(key(x, y))) return [x, y];
    for (let r = 1; r < 50; r++) {
      for (let dx = -r; dx <= r; dx++) {
        for (let dy = -r; dy <= r; dy++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          if (!taken.has(key(x + dx, y + dy))) return [x + dx, y + dy];
        }
      }
    }
    return [x, y];
  };
  const placeFrom = (fromId, toId, dir) => {
    const [fx, fy] = pos.get(fromId);
    const v = DIRS[dir] || FALLBACK[dir] || FALLBACK.unknown;
    for (const step of [1, 2]) {
      const tx = fx + v[0] * step, ty = fy + v[1] * step;
      if (!taken.has(key(tx, ty))) return place(toId, tx, ty);
    }
    const [x, y] = near(fx + v[0], fy + v[1]);
    place(toId, x, y);
  };

  for (const r of rooms) {
    const cell = pins.get(r.id);
    if (cell && !taken.has(key(...cell))) place(r.id, ...cell);
  }
  if (rooms.length && !pos.has(rooms[0].id)) place(rooms[0].id, ...near(0, 0));
  // Exploration order gives a stable, intuitive layout.
  let progress = true;
  while (progress) {
    progress = false;
    for (const e of edges) {
      if (pos.has(e.from) && !pos.has(e.to)) { placeFrom(e.from, e.to, e.dir); progress = true; }
      else if (pos.has(e.to) && !pos.has(e.from)) { placeFrom(e.to, e.from, INVERSE[e.dir]); progress = true; }
    }
  }
  for (const r of rooms) {
    if (!pos.has(r.id)) {
      const [x, y] = near(0, 0);
      place(r.id, x, y);
    }
  }
  return pos;
}

function wrapName(name) {
  const words = name.split(/\s+/);
  const lines = [""];
  for (const w of words) {
    const cur = lines[lines.length - 1];
    if ((cur + " " + w).trim().length > 17 && cur) lines.push(w);
    else lines[lines.length - 1] = (cur + " " + w).trim();
  }
  if (lines.length > 2) lines.splice(2, lines.length, lines.slice(1).join(" ").slice(0, 16) + "…");
  return lines;
}

function renderMap() {
  const rooms = erasing ? state.rooms.filter((r) => r.id === state.location) : state.rooms;
  const edges = erasing ? [] : state.edges;
  $("map-empty").style.display = rooms.length ? "none" : "grid";
  loadPins();
  positions = layout(rooms, edges);
  // A room being dragged follows the pointer, between grid cells.
  if (moving?.dragging && positions.has(moving.id)) positions.set(moving.id, [moving.x / CELL_W, moving.y / CELL_H]);

  const edgesG = $("edges");
  const roomsG = $("rooms");
  edgesG.replaceChildren();
  roomsG.replaceChildren();

  const center = (id) => {
    const [x, y] = positions.get(id);
    return [x * CELL_W, y * CELL_H];
  };

  // One line per pair of rooms. A pair travelled only one way gets an
  // arrowhead; it may be one-way by design, or the way back untried.
  const pairs = new Map();
  for (const e of edges) {
    if (!positions.has(e.from) || !positions.has(e.to) || e.from === e.to) continue;
    const pair = e.from < e.to ? `${e.from}-${e.to}` : `${e.to}-${e.from}`;
    if (!pairs.has(pair)) pairs.set(pair, []);
    pairs.get(pair).push(e);
  }
  for (const list of pairs.values()) {
    const first = list[0];
    const oneWay = list.every((e) => e.from === first.from);
    const [x1, y1] = center(first.from);
    const [x2, y2] = center(first.to);
    const [ax, ay] = roomEdge(x1, y1, x2, y2);
    const [bx, by] = roomEdge(x2, y2, x1, y1);
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", ax); line.setAttribute("y1", ay);
    line.setAttribute("x2", bx); line.setAttribute("y2", by);
    let cls = "edge";
    if (list.some((e) => !DIRS[e.dir] && e.dir !== "unknown")) cls += " vertical";
    else if (list.every((e) => e.dir === "unknown")) cls += " unknown";
    line.setAttribute("class", cls);
    if (oneWay) line.setAttribute("marker-end", "url(#arrow)");
    // Where the line passes under a room it doesn't connect, that room's
    // shadow fades it, so it doesn't look like two edges meeting there.
    const crossed = rooms.filter((r) => r.id !== first.from && r.id !== first.to &&
      crosses(ax, ay, bx, by, ...center(r.id), ROOM_W / 2 + SHADOW, ROOM_H / 2 + SHADOW));
    if (crossed.length) {
      const mask = document.createElementNS(svgNS, "mask");
      mask.id = `shadow-${first.from}-${first.to}`;
      mask.setAttribute("maskUnits", "userSpaceOnUse");
      // The line's surroundings, given explicitly: by default the region is
      // the viewport's, which misses map coordinates below zero.
      const region = [["x", Math.min(ax, bx) - 20], ["y", Math.min(ay, by) - 20],
        ["width", Math.abs(bx - ax) + 40], ["height", Math.abs(by - ay) + 40]];
      for (const [k, v] of region) mask.setAttribute(k, v);
      const all = document.createElementNS(svgNS, "rect");
      for (const [k, v] of [...region, ["fill", "white"]]) all.setAttribute(k, v);
      mask.append(all);
      for (const r of crossed) {
        const [cx, cy] = center(r.id);
        const shadow = document.createElementNS(svgNS, "rect");
        for (const [k, v] of [["x", cx - ROOM_W / 2 - SHADOW], ["y", cy - ROOM_H / 2 - SHADOW],
          ["width", ROOM_W + 2 * SHADOW], ["height", ROOM_H + 2 * SHADOW], ["rx", 8 + SHADOW], ["fill", "#222"],
          // Blurred, so the line fades gradually toward the room.
          ["filter", "url(#shadow-blur)"]]) shadow.setAttribute(k, v);
        mask.append(shadow);
      }
      edgesG.append(mask);
      line.setAttribute("mask", `url(#${mask.id})`);
    }
    edgesG.append(line);
    // Label the direction taken, at the end it was taken from, unless the
    // map already shows it.
    for (const e of list) {
      const text = edgeLabel(e);
      if (!text) continue;
      const [fx, fy] = center(e.from);
      const [tx, ty] = center(e.to);
      const [sx, sy] = roomEdge(fx, fy, tx, ty);
      const len = Math.hypot(tx - fx, ty - fy) || 1;
      const ux = (tx - fx) / len, uy = (ty - fy) / len;
      const t = document.createElementNS(svgNS, "text");
      // A little along the line, and off to its side.
      t.setAttribute("x", sx + ux * 16 - uy * 9);
      t.setAttribute("y", sy + uy * 16 + ux * 9);
      t.setAttribute("class", "edge-label");
      t.textContent = text;
      // A compass label can be clicked to lay the rooms out that way.
      if (DIRS[e.dir]) {
        t.classList.add("fixable");
        const title = document.createElementNS(svgNS, "title");
        title.textContent = `Put ${roomName(e.to)} ${DIR_WORDS[e.dir]} of ${roomName(e.from)}`;
        t.append(title);
        t.addEventListener("click", () => holdDirection(e));
      }
      edgesG.append(t);
    }
  }

  for (const r of rooms) {
    const [cx, cy] = center(r.id);
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "room" + (r.id === state.location ? " here" : "") + (moving?.dragging && moving.id === r.id ? " moving" : ""));
    g.dataset.id = r.id;
    g.setAttribute("transform", `translate(${cx - ROOM_W / 2},${cy - ROOM_H / 2})`);
    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("width", ROOM_W); rect.setAttribute("height", ROOM_H);
    rect.setAttribute("rx", 8);
    if (r.id === selected) rect.setAttribute("stroke-width", "2.5");
    g.append(rect);
    const lines = wrapName(r.name || `#${r.id}`);
    lines.forEach((line, i) => {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", ROOM_W / 2);
      t.setAttribute("y", ROOM_H / 2 + (i - (lines.length - 1) / 2) * 15);
      t.textContent = line;
      g.append(t);
    });
    const title = document.createElementNS(svgNS, "title");
    title.textContent = `${r.name} (#${r.id})`;
    g.append(title);
    g.addEventListener("click", () => {
      if (!dragged) select(r.id, true);
    });
    roomsG.append(g);
  }

  if (state.location !== lastLocation) {
    lastLocation = state.location;
    if (!view.userMoved) fitOrCenter();
  }
  applyView();
}

const DIR_WORDS = { n: "north", s: "south", e: "east", w: "west", ne: "northeast", nw: "northwest", se: "southeast", sw: "southwest" };

function roomName(id) {
  return state.rooms.find((r) => r.id === id)?.name || `#${id}`;
}

// Pins every room where it is now, before moving one by hand, so the
// automatic layout doesn't move the others.
function freezeLayout() {
  for (const [id, [x, y]] of positions) {
    if (Number.isInteger(x) && Number.isInteger(y)) pins.set(id, [x, y]);
  }
}

// Moves the room a move led to into the cell that direction points to from
// where it was taken. A room already there swaps into the moved room's old
// cell.
function holdDirection(e) {
  freezeLayout();
  const [fx, fy] = positions.get(e.from);
  const v = DIRS[e.dir];
  const cell = [fx + v[0], fy + v[1]];
  const old = positions.get(e.to);
  for (const [id, [x, y]] of positions) {
    if (id !== e.to && id !== e.from && x === cell[0] && y === cell[1]) pins.set(id, old);
  }
  pins.set(e.to, cell);
  savePins();
  renderMap();
}

// How far a room's shadow reaches past it, in map units.
const SHADOW = 16;

// Whether the segment from (x1, y1) to (x2, y2) passes through the box
// centered at (cx, cy) with half-sizes hw and hh (Liang-Barsky clipping).
function crosses(x1, y1, x2, y2, cx, cy, hw, hh) {
  let t0 = 0, t1 = 1;
  const dx = x2 - x1, dy = y2 - y1;
  for (const [p, q] of [[-dx, x1 - (cx - hw)], [dx, cx + hw - x1], [-dy, y1 - (cy - hh)], [dy, cy + hh - y1]]) {
    if (p === 0) {
      if (q < 0) return false;
    } else {
      const t = q / p;
      if (p < 0) t0 = Math.max(t0, t);
      else t1 = Math.min(t1, t);
      if (t0 > t1) return false;
    }
  }
  return true;
}

// Where the line from (x1, y1) toward (x2, y2) leaves the room centered at
// (x1, y1).
function roomEdge(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const hw = ROOM_W / 2 + 2, hh = ROOM_H / 2 + 2;
  const t = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  return t < 1 ? [x1 + dx * t, y1 + dy * t] : [x1, y1];
}

// The label for the direction an edge was taken in: always for up, down, in
// and out; for a compass direction, only when the rooms aren't laid out
// that way (as in many deliberately twisty maps); never for an unknown one.
function edgeLabel(e) {
  const vertical = { up: "U", down: "D", in: "IN", out: "OUT" }[e.dir];
  if (vertical) return vertical;
  const v = DIRS[e.dir];
  if (!v) return null;
  const [fx, fy] = positions.get(e.from);
  const [tx, ty] = positions.get(e.to);
  if (Math.sign(tx - fx) === v[0] && Math.sign(ty - fy) === v[1]) return null;
  return e.dir.toUpperCase();
}

function centerOn(id) {
  if (!positions.has(id)) return;
  const [x, y] = positions.get(id);
  view.x = x * CELL_W;
  view.y = y * CELL_H;
}

// Shows the whole map when it fits at a readable size, otherwise follows
// the player.
function fitOrCenter() {
  const svg = $("map");
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  if (!positions.size) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of positions.values()) {
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  const spanW = (maxX - minX) * CELL_W + ROOM_W + 48;
  const spanH = (maxY - minY) * CELL_H + ROOM_H + 48;
  const scale = Math.min(1, w / spanW, h / spanH);
  if (scale >= 0.6) {
    view.scale = scale;
    view.x = (minX + maxX) / 2 * CELL_W;
    view.y = (minY + maxY) / 2 * CELL_H;
  } else {
    view.scale = Math.max(view.scale, 0.8);
    centerOn(state.location);
  }
}

function applyView() {
  const svg = $("map");
  const w = svg.clientWidth || 800, h = svg.clientHeight || 600;
  const tx = w / 2 - view.x * view.scale;
  const ty = h / 2 - view.y * view.scale;
  $("viewport").setAttribute("transform", `translate(${tx},${ty}) scale(${view.scale})`);
}

function zoom(factor) {
  view.scale = Math.min(3, Math.max(0.2, view.scale * factor));
  // Keep the chosen zoom when the next turn redraws the map.
  view.userMoved = true;
  applyView();
}

// A room being dragged: where it is in map coordinates, once it has moved
// far enough to count as a drag rather than a click.
let moving = null;
// A drag just ended, so the click that follows it doesn't select.
let dragged = false;

(() => {
  const svg = $("map");
  const DRAG_THRESHOLD = 4;
  svg.addEventListener("pointerdown", (ev) => {
    const room = ev.target.closest(".room");
    if (!room || ev.button !== 0) return;
    const id = Number(room.dataset.id);
    const [gx, gy] = positions.get(id);
    moving = { id, from: [gx, gy], px: ev.clientX, py: ev.clientY, x: gx * CELL_W, y: gy * CELL_H, x0: gx * CELL_W, y0: gy * CELL_H, dragging: false };
    dragged = false;
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!moving) return;
    const dx = ev.clientX - moving.px, dy = ev.clientY - moving.py;
    if (!moving.dragging) {
      if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
      // Captured only once it's a drag, so a plain click still reaches
      // the room.
      moving.dragging = true;
      svg.setPointerCapture(ev.pointerId);
    }
    moving.x = moving.x0 + dx / view.scale;
    moving.y = moving.y0 + dy / view.scale;
    renderMap();
  });
  // Dropping snaps the room to the nearest cell; a room already there
  // swaps into the dragged room's old cell.
  const drop = (ev) => {
    if (!moving) return;
    const m = moving;
    moving = null;
    if (!m.dragging || ev.type === "pointercancel") {
      if (m.dragging) renderMap();
      return;
    }
    dragged = true;
    setTimeout(() => { dragged = false; }, 0);
    const cell = [Math.round(m.x / CELL_W), Math.round(m.y / CELL_H)];
    freezeLayout();
    for (const [id, [x, y]] of positions) {
      if (id !== m.id && x === cell[0] && y === cell[1]) pins.set(id, m.from);
    }
    pins.set(m.id, cell);
    savePins();
    renderMap();
  };
  svg.addEventListener("pointerup", drop);
  svg.addEventListener("pointercancel", drop);

  let drag = null;
  svg.addEventListener("pointerdown", (ev) => {
    if (ev.target.closest(".room, .fixable")) return;
    drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
    svg.setPointerCapture(ev.pointerId);
    svg.classList.add("dragging");
  });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    view.x = drag.vx - (ev.clientX - drag.x) / view.scale;
    view.y = drag.vy - (ev.clientY - drag.y) / view.scale;
    view.userMoved = true;
    applyView();
  });
  const end = () => { drag = null; svg.classList.remove("dragging"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    zoom(ev.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });
  $("zoom-in").addEventListener("click", () => zoom(1.25));
  $("zoom-out").addEventListener("click", () => zoom(0.8));
  const fit = () => {
    view.userMoved = false;
    view.scale = 1;
    if (state) fitOrCenter();
    applyView();
  };
  $("recenter").addEventListener("click", fit);
  $("erase-map").addEventListener("click", async () => {
    if (!state) return;
    // Clear the map at once; the server erases its copy at the next turn.
    // Rooms placed by hand go too.
    erasing = true;
    pins.clear();
    savePins();
    renderMap();
    fit();
    const ok = await fetch("/erase-map", { method: "POST" }).then((res) => res.ok, () => false);
    if (!ok) {
      erasing = false;
      renderMap();
    }
  });
  // The map's panel changes size with the window and the splitter.
  new ResizeObserver(applyView).observe(svg);
})();

$("search").addEventListener("input", () => state && renderTree());
$("follow").addEventListener("click", () => state && select(state.location, true));

applyLayout(tiling.matches ? loadLayout() : DEFAULT_LAYOUT);
poll();
</script>
</body>
</html>
