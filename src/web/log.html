<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-Machine Audit Log</title>
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --border: #dedbd2;
  --text: #22211e;
  --muted: #76726a;
  --accent: #c2410c;
  --warn-bg: #fdecec;
  --warn: #b91c1c;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15161a;
    --panel: #1d1f24;
    --border: #33363e;
    --text: #e6e4df;
    --muted: #9a978f;
    --accent: #fb923c;
    --warn-bg: #3a1a1a;
    --warn: #f87171;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
header {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
}
h1 { font-size: 15px; margin: 0; font-weight: 650; }
.counts { color: var(--muted); font-size: 13px; display: flex; gap: 14px; }
.counts b { color: var(--text); }
.counts .bad b { color: var(--warn); }
label { margin-left: auto; font-size: 13px; color: var(--muted); }
.status { font-size: 12px; color: var(--muted); }
main { padding: 0 16px 16px; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
td.time, td.kind { white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--muted); }
td.detail { font-family: var(--mono); font-size: 13px; word-break: break-word; }
td.client { color: var(--muted); font-size: 12px; word-break: break-word; max-width: 18em; }
tr.suspicious { background: var(--warn-bg); }
tr.suspicious td.kind { color: var(--warn); font-weight: 600; }
tr.command td.kind { color: var(--accent); }
.empty { color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<header>
  <h1>Audit log</h1>
  <div class="counts">
    <span>Commands <b id="n-command">0</b></span>
    <span>Typed <b id="n-keyboard">0</b></span>
    <span class="bad">Suspicious <b id="n-suspicious">0</b></span>
  </div>
  <label><input type="checkbox" id="only-suspicious"> Only suspicious</label>
  <span class="status" id="status">connecting…</span>
</header>
<main>
  <table>
    <thead><tr><th>Time</th><th>Kind</th><th>What</th><th>Client</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty">No requests yet. Commands sent with POST /command, lines typed at the keyboard, players joining and leaving, the leadership, kicks, passwords, game restarts and any use of the object inspector appear here.</div>
</main>
<script>
const rows = document.getElementById("rows");
const counts = { command: 0, keyboard: 0, suspicious: 0 };
const onlySuspicious = document.getElementById("only-suspicious");
const labels = {
  command: "command", keyboard: "typed", inspector: "inspector",
  snapshot: "snapshot", refused: "refused", join: "players", login: "password",
  leader: "leader", kick: "kick", password: "password", access: "inspector", game: "game",
};

onlySuspicious.addEventListener("change", () => {
  for (const tr of rows.children) tr.hidden = onlySuspicious.checked && !tr.classList.contains("suspicious");
});

function add(e) {
  const tr = document.createElement("tr");
  tr.className = e.kind + (e.suspicious ? " suspicious" : "");
  tr.hidden = onlySuspicious.checked && !e.suspicious;
  const cells = [
    ["time", new Date(e.time).toLocaleTimeString()],
    ["kind", labels[e.kind] || e.kind],
    ["detail", e.detail],
    ["client", e.client],
  ];
  for (const [cls, text] of cells) {
    const td = document.createElement("td");
    td.className = cls;
    td.textContent = text;
    tr.appendChild(td);
  }
  rows.prepend(tr);
  if (e.kind in counts) counts[e.kind]++;
  if (e.suspicious) counts.suspicious++;
}

async function poll() {
  let last = 0;
  const status = document.getElementById("status");
  for (;;) {
    try {
      const res = await fetch(`/events?since=${last}`, { cache: "no-store" });
      const data = await res.json();
      data.events.forEach(add);
      last = data.last;
      for (const k in counts) document.getElementById("n-" + k).textContent = counts[k];
      document.getElementById("empty").hidden = rows.children.length > 0;
      status.textContent = "live";
    } catch {
      status.textContent = "disconnected; retrying";
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}
poll();
</script>
</body>
</html>
