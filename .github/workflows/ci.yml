name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: aarch64-linux
            os: ubuntu-24.04-arm
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-windows
            os: windows-latest
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the version named by minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@v2
      # Once is enough, and Windows checkouts have CRLF line endings.
      - name: Check formatting
        if: matrix.target == 'x86_64-linux'
        run: zig fmt --check build.zig src
      - name: Build
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
